name: Numeric Regression (SLATEC)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  numeric:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}      # login shell so the conda env is active
    steps:
      - uses: actions/checkout@v4

      - name: Build Booth
        run: make

      - name: Setup tinygrad emulator
        run: |
          # Pinned: the emu harness imports tinygrad's test.mockgpu.amd.emu,
          # an internal API upstream reshuffles between versions (and recently
          # deleted on tip). This is the commit the kernels were verified on.
          git clone https://github.com/tinygrad/tinygrad.git /tmp/tinygrad
          git -C /tmp/tinygrad checkout 5a22e7f1b0254b534f1f35a640b04efcc8d77488
          pip install -e /tmp/tinygrad

      - name: Install LFortran
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: lf
          create-args: >-
            python=3.11
            lfortran

      - name: Numeric regression vs baseline
        env:
          KATH: ./kath
          LFORTRAN: lfortran
          TINYGRAD_PATH: /tmp/tinygrad
        run: python tests/numeric/run_numeric.py --backends cpu,rdna3,rdna4
